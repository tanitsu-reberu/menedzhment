<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Экстренная подготовка: Управление проектами</title>
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-card" viewBox="0 0 24 24">
      <rect x="4" y="5" width="16" height="14" rx="2"></rect>
      <path d="M8 9h8M8 13h5"></path>
    </symbol>
    <symbol id="icon-quiz" viewBox="0 0 24 24">
      <path d="M9 9a3 3 0 1 1 5 2.6c-1.3.7-2 1.5-2 3"></path>
      <path d="M12 18h.01"></path>
      <circle cx="12" cy="12" r="9"></circle>
    </symbol>
    <symbol id="icon-trophy" viewBox="0 0 24 24">
      <path d="M8 4h8v4a4 4 0 0 1-8 0V4Z"></path>
      <path d="M8 6H5a2 2 0 0 0 2 4h1"></path>
      <path d="M16 6h3a2 2 0 0 1-2 4h-1"></path>
      <path d="M12 12v5M9 20h6M10 17h4"></path>
    </symbol>
    <symbol id="icon-reset" viewBox="0 0 24 24">
      <path d="M4 12a8 8 0 1 0 2.3-5.7"></path>
      <path d="M4 4v6h6"></path>
    </symbol>
    <symbol id="icon-next" viewBox="0 0 24 24">
      <path d="M5 12h14M13 6l6 6-6 6"></path>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="m5 13 4 4L19 7"></path>
    </symbol>
    <symbol id="icon-expand" viewBox="0 0 24 24">
      <path d="M9 3H5a2 2 0 0 0-2 2v4M15 3h4a2 2 0 0 1 2 2v4M21 15v4a2 2 0 0 1-2 2h-4M3 15v4a2 2 0 0 0 2 2h4"></path>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="M6 6l12 12M18 6 6 18"></path>
    </symbol>
    <symbol id="icon-list" viewBox="0 0 24 24">
      <path d="M4 7h16M4 12h16M4 17h16"></path>
    </symbol>
    <symbol id="icon-chevron-right" viewBox="0 0 24 24">
      <path d="M9 6l6 6-6 6"></path>
    </symbol>
  </svg>

  <main class="app-shell">
    <section class="topbar">
      <div>
        <p class="eyebrow">Экзамен через 2 дня</p>
        <h1>
          <span class="title-full">Управление проектами</span>
          <span class="title-short">Упр. проектами</span>
        </h1>
      </div>
      <div class="stats-panel" aria-live="polite">
        <div class="stat">
          <span>XP</span>
          <strong id="xpValue">0</strong>
        </div>
        <div class="stat">
          <span>Уровень</span>
          <strong id="levelValue">1</strong>
        </div>
        <button class="icon-button" id="resetButton" type="button" aria-label="Сбросить прогресс" title="Сбросить прогресс">
          <svg><use href="#icon-reset"></use></svg>
        </button>
      </div>
    </section>

    <section class="level-strip">
      <div class="level-meta">
        <span id="levelTitle">Новичок проекта</span>
        <span id="levelProgressLabel">0 / 120 XP</span>
      </div>
      <div class="progress-track" aria-label="Прогресс уровня">
        <div class="progress-fill" id="levelProgress"></div>
      </div>
    </section>

    <section class="mode-tabs" role="tablist" aria-label="Режим тренировки">
      <button class="mode-tab active" id="flashModeButton" type="button" role="tab" aria-selected="true">
        <svg><use href="#icon-card"></use></svg>
        <span>Карточки</span>
      </button>
      <button class="mode-tab" id="quizModeButton" type="button" role="tab" aria-selected="false">
        <svg><use href="#icon-quiz"></use></svg>
        <span>Блиц-тест</span>
      </button>
      <button class="mode-tab" id="achievementsButton" type="button" role="tab" aria-selected="false">
        <svg><use href="#icon-trophy"></use></svg>
        <span>Бейджи</span>
      </button>
    </section>

    <section class="workspace">
      <button class="topic-drawer-toggle" id="topicDrawerToggle" type="button" aria-expanded="false" aria-controls="topicRail">
        <svg class="topic-drawer-toggle-icon"><use href="#icon-list"></use></svg>
        <span class="topic-drawer-toggle-text">
          <span class="topic-drawer-toggle-label">Тема</span>
          <strong id="activeTopicLabel">Проект</strong>
        </span>
        <svg class="topic-drawer-toggle-chevron"><use href="#icon-chevron-right"></use></svg>
      </button>

      <div class="topic-drawer-backdrop" id="topicDrawerBackdrop" aria-hidden="true"></div>

      <aside class="topic-rail" id="topicRail" aria-label="Темы экзамена">
        <div class="rail-head">
          <span>Темы</span>
          <strong id="topicCount">0</strong>
          <button class="topic-drawer-close" id="closeTopicDrawerButton" type="button" aria-label="Закрыть список тем">
            <svg><use href="#icon-close"></use></svg>
          </button>
        </div>
        <div class="topic-list" id="topicList"></div>
      </aside>

      <section class="study-panel active" id="flashcardsView" aria-labelledby="flashModeButton">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Flashcards</p>
            <h2 id="cardTopic">Понятие</h2>
          </div>
          <div class="panel-tools">
            <div class="counter" id="cardCounter">1 / 1</div>
            <button class="fullscreen-toggle" id="toggleFullscreenButton" type="button" aria-label="На весь экран" aria-pressed="false" title="На весь экран">
              <svg class="icon-expand"><use href="#icon-expand"></use></svg>
              <svg class="icon-close"><use href="#icon-close"></use></svg>
              <span class="fullscreen-toggle-label">На весь экран</span>
            </button>
          </div>
        </div>

        <button class="flashcard" id="flashcard" type="button" aria-live="polite">
          <span class="flashcard-face flashcard-front">
            <span class="tag" id="cardPriority">Приоритет</span>
            <strong id="cardTerm">Термин</strong>
          </span>
          <span class="flashcard-face flashcard-back">
            <span class="tag">Разбор</span>
            <strong id="cardAnswer">Объяснение</strong>
          </span>
        </button>

        <div class="actions">
          <button class="secondary-button" id="prevCardButton" type="button">Назад</button>
          <button class="primary-button" id="nextCardButton" type="button">
            <span>Следующая</span>
            <svg><use href="#icon-next"></use></svg>
          </button>
        </div>
        <p class="fullscreen-hint" id="fullscreenHint">Нажми на карточку, чтобы перевернуть</p>
      </section>

      <section class="study-panel" id="quizView" aria-labelledby="quizModeButton">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Blitz</p>
            <h2 id="quizTopic">Вопрос</h2>
          </div>
          <div class="counter" id="quizCounter">1 / 1</div>
        </div>

        <div class="quiz-card">
          <p id="questionText">Вопрос</p>
          <div class="answers" id="answers"></div>
          <div class="feedback" id="feedback" aria-live="polite"></div>
        </div>

        <div class="actions">
          <button class="secondary-button" id="restartQuizButton" type="button">Перемешать</button>
          <button class="primary-button" id="nextQuestionButton" type="button" disabled>
            <span>Дальше</span>
            <svg><use href="#icon-next"></use></svg>
          </button>
        </div>
      </section>

      <section class="study-panel" id="achievementsView" aria-labelledby="achievementsButton">
        <div class="panel-head">
          <div>
            <p class="eyebrow">Награды</p>
            <h2>Бейджи подготовки</h2>
          </div>
          <div class="counter" id="achievementCounter">0 / 0</div>
        </div>
        <div class="badge-grid" id="badgeGrid"></div>
      </section>
    </section>
  </main>

  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <div class="xp-float" id="xpFloat" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
